name: build

# A portable Renode with the SEVONPEND fix, built here so that packaging
# MeshBench is a download rather than a toolchain.
#
# The fix lives in two submodules - tlib answers the architectural question and
# the NVIC provides the answer - so this builds from source rather than patching
# a release. Everything else is stock Renode.

# Dispatch only. Every push used to rebuild all three platforms and publish
# nothing, and with the macOS leg on the org's single Mac, each stray rebuild
# parked a real one behind it in the queue.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release from this build'
        type: boolean
        default: true

jobs:
  linux:
    runs-on: ubuntu-latest
    # The release step needs to write one. Without this the whole build
    # succeeds and then dies at the last line with "Resource not accessible
    # by integration", which reads like a credentials problem and is a
    # default: repository tokens are read-only unless a job asks.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show what we are building
        run: |
          git log --oneline -1
          git submodule status | sed 's/^/  /'

      - name: Dependencies
        run: |
          sudo apt-get update
          # gcc-multilib is the one that matters: the CPU cores are built
          # 32-bit. No GTK bindings - those are for the Mono UI build, and
          # gtk-sharp2 no longer exists on Ubuntu 24.04 anyway; --net builds
          # the .NET Renode, which is what we want for a headless emulator.
          sudo apt-get install -y --no-install-recommends \
            git cmake gcc g++ gcc-multilib g++-multilib \
            python3 python3-pip dotnet-sdk-8.0

      - name: Build
        # -t is the portable package: it bundles the .NET runtime, so the
        # result runs on a machine with no dotnet installed. That is the whole
        # point - setting MeshBench up should not mean installing a runtime.
        # (-p is the distribution package and wants fpm, which we do not need.)
        run: ./build.sh --net -t

      - name: Confirm the fix is in the binary we built
        run: |
          set -e
          # Cheap and specific: the symbol only exists on the patched branch, so
          # its absence means a submodule quietly resolved to upstream.
          if ! grep -rq "tlib_nvic_get_pending_irq" src/Infrastructure/src/Emulator/Cores/tlib/arch/arm/arch_callbacks.h; then
            echo "tlib is not the patched one" >&2
            exit 1
          fi
          if ! grep -rq "AnyInterruptPending" src/Infrastructure/src/Emulator/Cores/Arm-M/NVIC.cs; then
            echo "renode-infrastructure is not the patched one" >&2
            exit 1
          fi
          echo "both halves of the SEVONPEND fix are present"

      - name: Collect the portable package
        run: |
          set -e
          mkdir -p dist
          find output packages -maxdepth 3 -name '*portable*.tar.gz' 2>/dev/null | head
          # Renamed on the way in, so the mark travels with the file. These
          # are not upstream Renode releases - they carry the SEVONPEND fix -
          # and a copy found loose on a disk should say whose build it is.
          # The name keeps "linux" and "portable" either side of the mark, so
          # MeshBench's download pattern still matches it.
          for f in $(find output packages -maxdepth 3 -name '*portable*.tar.gz' 2>/dev/null); do
            base=$(basename "$f")
            case "$base" in
              *meshbench*) cp "$f" "dist/$base" ;;
              *) cp "$f" "dist/${base%.tar.gz}-meshbench.tar.gz" ;;
            esac
          done
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "portable package not found; falling back to the built tree" >&2
            tar czf dist/renode-meshbench-linux-x86_64.tar.gz -C output/bin Release
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: renode-meshbench-linux
          path: dist/*

  macos:
    # The org's own M4. Safe because this workflow triggers on push and
    # dispatch only - both need write access - and build.sh detects the host
    # and picks the osx-arm64 runtime itself.
    runs-on: [self-hosted, macos-m4]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }

      - name: Dependencies
        run: |
          brew install --quiet cmake dotnet-sdk || brew install --quiet cmake
          dotnet --version || true

      - name: Build
        run: ./build.sh --net -t

      - name: Confirm the fix is in the binary we built
        run: |
          set -e
          grep -rq "tlib_nvic_get_pending_irq" src/Infrastructure/src/Emulator/Cores/tlib/arch/arm/arch_callbacks.h
          grep -rq "AnyInterruptPending" src/Infrastructure/src/Emulator/Cores/Arm-M/NVIC.cs
          echo "both halves of the SEVONPEND fix are present"

      - name: Collect the portable package
        run: |
          set -e
          mkdir -p dist
          for f in $(find output packages -maxdepth 3 -name '*portable*.tar.gz' 2>/dev/null); do
            base=$(basename "$f")
            case "$base" in
              *meshbench*) cp "$f" "dist/$base" ;;
              *) cp "$f" "dist/${base%.tar.gz}-meshbench.tar.gz" ;;
            esac
          done
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            tar czf dist/renode-meshbench-macos-arm64.tar.gz -C output/bin Release
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: renode-meshbench-macos
          retention-days: 5
          path: dist/*

  windows:
    # Renode has no Windows build entry point of its own - build.sh is the
    # only one - so it runs under MSYS2, the same way the QEMU fork builds
    # there. Free on a public repository.
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # mingw-w64-x86_64-make, not only MSYS make: cmake drives the build
          # with the "MinGW Makefiles" generator, which looks for mingw32-make
          # and stops with CMAKE_MAKE_PROGRAM unset without it. The comment
          # lives HERE because a # inside a folded install: list is not a
          # comment - pacman was handed 'MinGW' and 'CMAKE_MAKE_PROGRAM' as
          # package names, which is this exact line's previous life.
          install: >-
            git
            make
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python

      - name: .NET
        shell: pwsh
        run: dotnet --list-sdks

      - name: Build
        # The MSYS2 shell does not inherit Windows' PATH, so the dotnet the
        # runner image carries is invisible from here - the C cores built all
        # the way and the .NET half then died on "dotnet: command not found".
        # No fallback swallow any more either: the job went green while
        # publishing nothing, twice, and a red job that names its line is
        # cheaper than a green one that lies.
        run: |
          export PATH="$PATH:/c/Program Files/dotnet"
          dotnet --version
          ./build.sh --net -t

      - name: Collect the portable package
        run: |
          mkdir -p dist
          for f in $(find output packages -maxdepth 3 -name '*portable*' 2>/dev/null); do
            base=$(basename "$f")
            case "$base" in
              *meshbench*) cp "$f" "dist/$base" ;;
              *) cp "$f" "dist/meshbench-$base" ;;
            esac
          done
          ls -la dist || true

      - uses: actions/upload-artifact@v4
        if: hashFiles('dist/*') != ''
        with:
          name: renode-meshbench-windows
          retention-days: 5
          path: dist/*

  release:
    # always(), so the platforms that built are published even while another
    # is still being taught to. A release with nothing in it is refused below.
    if: always() && github.event_name == 'workflow_dispatch' && inputs.release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: all }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p dist && find all -type f -exec cp {} dist/ \; || true
          ls -la dist
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::nothing built; not publishing an empty release"; exit 1
          fi
          TAG="meshbench-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          cat > /tmp/notes.md <<'NOTES'
          Stock Renode with one change: SEVONPEND generates an event for any
          exception entering the pending state, not only for ones the CPU would
          accept (ARM DDI0403E B1.5.17).

          Without it, firmware that sets SEVONPEND, sleeps on WFE and then reads
          ISPR - handling the source in thread mode with the interrupt
          deliberately left disabled - never wakes. MeshCore's published nRF52
          builds do exactly that.

          Changed in two submodules, both forks of upstream:
          https://github.com/MeshBench/tlib/tree/sevonpend-any-pending
          https://github.com/MeshBench/renode-infrastructure/tree/sevonpend-any-pending

          These are not upstream Renode releases. The files say meshbench for
          that reason, and each is the portable package, which carries its own
          .NET runtime.
          NOTES
          gh release create "$TAG" dist/* \
            --title "Renode for MeshBench ($TAG)" \
            --notes-file /tmp/notes.md
